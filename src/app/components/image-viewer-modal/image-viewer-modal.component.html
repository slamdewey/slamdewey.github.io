@if (isModalOpen()) {
  <div
    tabindex="-1"
    class="image-modal"
    (wheel)="onModalWheel($event)"
    (mousedown)="onModalMouseDown($event)"
    (mouseup)="onModalMouseUp($event)"
    (mousemove)="onModalMouseMove($event)">
    @if (shouldDisplaySpinner()) {
      <x-spinner class="image-modal__spinner" />
    }
    <div class="image-modal__toolbar" (mousedown)="$event.stopPropagation()">
      <button type="button" class="image-modal__btn" title="Zoom out" aria-label="Zoom out" (click)="zoomOut()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
          <line x1="8" y1="11" x2="14" y2="11" />
        </svg>
      </button>
      <button type="button" class="image-modal__btn" title="Zoom in" aria-label="Zoom in" (click)="zoomIn()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
          <line x1="11" y1="8" x2="11" y2="14" />
          <line x1="8" y1="11" x2="14" y2="11" />
        </svg>
      </button>
      <button type="button" class="image-modal__btn" title="Reset view" aria-label="Reset view" (click)="resetZoom()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3" />
          <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
          <path d="M3 16v3a2 2 0 0 0 2 2h3" />
          <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
        </svg>
      </button>
      <span class="image-modal__divider" aria-hidden="true"></span>
      <button
        type="button"
        class="image-modal__btn image-modal__btn--close"
        title="Close"
        aria-label="Close"
        (click)="closeModal()">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true">
          <line x1="6" y1="6" x2="18" y2="18" />
          <line x1="18" y1="6" x2="6" y2="18" />
        </svg>
      </button>
    </div>
    <img
      alt="Full size image"
      class="image-modal__content"
      loading="lazy"
      [style.transform]="zoomOptionsViewTransform()"
      (load)="checkIfImageLoadingComplete($event)"
      [attr.src]="imageSource()" />
  </div>
}
